<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#04392b"/>
      <stop offset="100%" stop-color="#02241b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="crescentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners for standalone view -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>

  <!-- Subtle Islamic 8-Point Star Geometry in background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2" fill="none">
    <rect x="136" y="136" width="240" height="240" rx="12"/>
    <rect x="136" y="136" width="240" height="240" rx="12" transform="rotate(45 256 256)"/>
    <circle cx="256" cy="256" r="160"/>
    <circle cx="256" cy="256" r="110"/>
  </g>

  <!-- Golden Outer Frame Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-dasharray="8 6" opacity="0.8"/>
  <circle cx="256" cy="256" r="182" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.9"/>

  <!-- Mosque Dome Silhouette -->
  <path d="M 216 350 C 216 300 236 265 256 240 C 276 265 296 300 296 350 Z" fill="url(#goldGrad)" opacity="0.25"/>
  <rect x="200" y="350" width="112" height="12" rx="4" fill="url(#goldGrad)" opacity="0.4"/>

  <!-- Iconic Islamic Crescent Moon -->
  <path d="M 275 140 A 105 105 0 1 0 355 285 A 92 92 0 1 1 275 140 Z" fill="url(#crescentGrad)" filter="url(#glow)"/>

  <!-- 8-Point Star -->
  <path d="M 330 185 L 334 197 L 346 201 L 334 205 L 330 217 L 326 205 L 314 201 L 326 197 Z" fill="#fef08a" filter="url(#glow)"/>

  <!-- Arabic Typography "صلاتي" -->
  <text x="256" y="415" font-family="'Amiri', 'Tajawal', 'Traditional Arabic', serif" font-size="58" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">صلاتي</text>
  <text x="256" y="445" font-family="'Tajawal', sans-serif" font-size="20" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="4">SALATI</text>
</svg>
