name: Build Salati APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install PWA plugin
        run: npm install -D vite-plugin-pwa

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Setup Signing Keystore
        id: setup_signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "keystore_ready=true" >> $GITHUB_OUTPUT
          else
            echo "SIGNING_KEYSTORE_BASE64 secret is not configured or empty!"
            echo "keystore_ready=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.setup_signing.outputs.keystore_ready }}" != "true" ]; then
            echo "ERROR: Cannot build a signed release APK because SIGNING_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          ./gradlew assembleRelease

      - name: Cleanup Keystore
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/release.keystore" ]; then
            rm -f "$RUNNER_TEMP/release.keystore"
            echo "Keystore securely removed."
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: salati-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
